<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0d16">
    <title>Create a short URL · Shortly</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>
        if (localStorage.getItem('shortly-theme') === 'light') {
            document.documentElement.dataset.theme = 'light';
        }
    </script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body class="standalone-page">
<header class="standalone-topbar">
    <a class="brand" th:href="@{/}" aria-label="Shortly home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10.6 13.4a4.5 4.5 0 0 0 6.36 0l2.12-2.12a4.5 4.5 0 0 0-6.36-6.36L11.5 6.14M13.4 10.6a4.5 4.5 0 0 0-6.36 0l-2.12 2.12a4.5 4.5 0 0 0 6.36 6.36l1.22-1.22"/></svg></span>
        <span class="brand-name">shortly<span>.</span></span>
    </a>
    <nav class="standalone-nav" aria-label="Main navigation">
        <a th:href="@{/dashboard}">Dashboard</a>
        <span aria-hidden="true">·</span>
        <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
            <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
            <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z"/></svg>
        </button>
    </nav>
</header>

<main class="standalone-main">
    <div class="standalone-heading">
        <div class="eyebrow"><span class="eyebrow-line"></span> FAST, SIMPLE, SHAREABLE</div>
        <h1>Make a long link <span class="heading-accent">go further.</span></h1>
        <p>Create a compact link and get back to what matters.</p>
    </div>

    <section class="panel standalone-card" aria-label="Create a short URL">
        <div class="inline-alert" th:if="${error}" role="alert">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/></svg>
            <span th:text="${error}">We couldn't create your short link.</span>
        </div>
        <form th:action="@{/shorten}" method="post" th:object="${shortUrlRequest}" id="shortenForm" class="standalone-form">
            <div class="form-field">
                <label for="url">Destination URL</label>
                <div class="input-with-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a4.5 4.5 0 0 0 6.36 0l2.12-2.12a4.5 4.5 0 0 0-6.36-6.36L11.5 6.14M13.4 10.6a4.5 4.5 0 0 0-6.36 0l-2.12 2.12a4.5 4.5 0 0 0 6.36 6.36l1.22-1.22"/></svg>
                    <input type="url" id="url" th:field="*{url}" placeholder="https://your-domain.com/a/very/long/path" required autofocus>
                </div>
                <small class="field-error" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></small>
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label for="customAlias">Custom alias <span class="optional-label">OPTIONAL</span></label>
                    <div class="input-with-prefix"><span class="input-prefix">/</span><input type="text" id="customAlias" th:field="*{customAlias}" placeholder="my-custom-link" autocomplete="off"></div>
                    <small>Letters, numbers, hyphens, and underscores.</small>
                    <small class="field-error" th:if="${#fields.hasErrors('customAlias')}" th:errors="*{customAlias}"></small>
                </div>
                <div class="form-field">
                    <label for="expiryHours">Link expiration <span class="optional-label">OPTIONAL</span></label>
                    <div class="input-with-suffix"><input type="number" id="expiryHours" th:field="*{expiryHours}" min="1" placeholder="No expiration"><span class="input-suffix">hours</span></div>
                    <small>Leave blank to keep your link active.</small>
                    <small class="field-error" th:if="${#fields.hasErrors('expiryHours')}" th:errors="*{expiryHours}"></small>
                </div>
            </div>
            <button class="button button-primary standalone-submit" type="submit" data-submit-button>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a4.5 4.5 0 0 0 6.36 0l2.12-2.12a4.5 4.5 0 0 0-6.36-6.36L11.5 6.14M13.4 10.6a4.5 4.5 0 0 0-6.36 0l-2.12 2.12a4.5 4.5 0 0 0 6.36 6.36l1.22-1.22"/></svg>
                <span>Generate short URL</span>
            </button>
        </form>
    </section>
    <p class="standalone-footer">Need an overview? <a th:href="@{/dashboard}">Explore your dashboard</a></p>
</main>
<div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
